services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnicore
      POSTGRES_USER: omnicore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnicore -d omnicore']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  postgres_data:
