name: OmniCore CI
on:
  push:
    branches: [main, feat/catalog-foundation]
  pull_request:
    branches: [main]
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @omnicore/shared typecheck
      - run: pnpm --filter @omnicore/shared test
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @omnicore/database generate
        env:
          DATABASE_URL: postgresql://omnicore:test@localhost:5432/omnicore
      - run: pnpm --filter @omnicore/database validate
        env:
          DATABASE_URL: postgresql://omnicore:test@localhost:5432/omnicore
      - run: pnpm --filter @omnicore/database typecheck
        env:
          DATABASE_URL: postgresql://omnicore:test@localhost:5432/omnicore
      - run: pnpm --filter @omnicore/database test
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @omnicore/database generate
        env:
          DATABASE_URL: postgresql://omnicore:test@localhost:5432/omnicore
      - run: pnpm --filter @omnicore/api typecheck
  web-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @omnicore/web build
      - run: pnpm --filter @omnicore/web exec playwright install --with-deps chromium
      - run: pnpm --filter @omnicore/web test:e2e
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
