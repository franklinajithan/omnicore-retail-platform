name: Core Architecture Checks
on:
  push:
    branches:
      - team/core-architecture
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/database/**'
      - '.github/workflows/core-architecture.yml'
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
        working-directory: .
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: .
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
