name: Deploy OmniCore API to Vercel
on:
  workflow_dispatch:
  push:
    branches: [feat/catalog-foundation]
    paths:
      - 'apps/api/**'
      - 'packages/database/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-omnicore-api.yml'
permissions:
  contents: read
concurrency:
  group: omnicore-api-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      VERCEL_ORG_ID: ${{ secrets.OMNICORE_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.OMNICORE_VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: .
      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema ../../packages/database/prisma/schema.prisma
      - name: Typecheck API
        run: pnpm exec tsc --noEmit
      - name: Build API
        run: pnpm run build
      - name: Check deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.OMNICORE_VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || {
            echo "Configure OMNICORE_VERCEL_TOKEN, OMNICORE_VERCEL_ORG_ID and OMNICORE_VERCEL_API_PROJECT_ID in GitHub Actions secrets."
            exit 1
          }
      - name: Pull Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.OMNICORE_VERCEL_TOKEN }}
        run: pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build and deploy API
        env:
          VERCEL_TOKEN: ${{ secrets.OMNICORE_VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
